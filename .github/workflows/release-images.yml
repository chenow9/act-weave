# Build frontend + backend images and push them to Alibaba Cloud ACR
# Personal Edition when a version tag is pushed.
#
# Required GitHub configuration (Settings → Secrets and variables → Actions):
#   Variables
#     ACR_REGISTRY   login host only, no scheme, e.g.
#                    crpi-xxxxxxxx.cn-hangzhou.personal.cr.aliyuncs.com
#                    (classic personal ACR: registry.cn-hangzhou.aliyuncs.com)
#     ACR_NAMESPACE  chenow
#   Secrets
#     ACR_USERNAME   ACR access-credential username (Aliyun account or RAM UPN
#                    prefix, shown on 个人版实例 → 访问凭证)
#     ACR_PASSWORD   ACR fixed registry password (not the Aliyun console password
#                    unless you set them to the same value)
#
# Images:
#   $ACR_REGISTRY/$ACR_NAMESPACE/actweave-backend:<tag>
#   $ACR_REGISTRY/$ACR_NAMESPACE/actweave-frontend:<tag>
# plus :latest on tag pushes.
name: release-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to push (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

env:
  ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
  ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE || 'chenow' }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            image: actweave-backend
          - name: frontend
            context: .
            file: ./frontend/Dockerfile
            image: actweave-frontend
    steps:
      - name: Check ACR configuration
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          missing=0
          for name in ACR_REGISTRY ACR_NAMESPACE ACR_USERNAME ACR_PASSWORD; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty. Set repository variables ACR_REGISTRY and ACR_NAMESPACE, and secrets ACR_USERNAME and ACR_PASSWORD."
              missing=1
            fi
          done
          exit "$missing"

      - name: Resolve image tag
        id: tag
        env:
          RAW_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          if ! printf '%s' "$RAW_TAG" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::Refusing image tag that is not a valid Docker tag: $RAW_TAG"
            exit 1
          fi
          echo "value=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ACR Personal Edition rejects the extra attestation index Buildx
          # attaches by default.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
