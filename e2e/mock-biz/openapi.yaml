openapi: 3.0.3
info:
  title: Mock Corp Expense API
  description: |
    第三方模拟业务系统：企业费用报销 + 主管审批 + 部门预算。
    鉴权为 Bearer 用户业务 Token（供 ActWeave REQUEST_PASSTHROUGH 透传）。
  version: 1.0.0
servers:
  - url: http://127.0.0.1:18080
    description: local mock
paths:
  /v1/me:
    get:
      operationId: getMe
      summary: 获取当前登录业务用户
      tags: [Identity]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/expenses:
    get:
      operationId: listMyExpenses
      summary: 列出我的报销单
      tags: [Expenses]
      security: [{bearerAuth: []}]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]
      responses:
        "200":
          description: expense list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Expense"
                  total:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createExpense
      summary: 创建报销单（草稿或直接提交）
      tags: [Expenses]
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseRequest"
      responses:
        "201":
          description: created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /v1/expenses/{id}:
    get:
      operationId: getExpense
      summary: 查询报销单详情
      tags: [Expenses]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "200":
          description: expense
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/expenses/{id}/submit:
    post:
      operationId: submitExpense
      summary: 提交草稿报销单进入审批
      tags: [Expenses]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      responses:
        "200":
          description: submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "409":
          description: invalid status
  /v1/approvals/pending:
    get:
      operationId: listPendingApprovals
      summary: 列出待我审批的报销单（主管）
      tags: [Approvals]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: pending list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Expense"
                  total:
                    type: integer
  /v1/approvals/{id}/decide:
    post:
      operationId: decideApproval
      summary: 审批通过或驳回
      tags: [Approvals]
      security: [{bearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/ExpenseId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DecideRequest"
      responses:
        "200":
          description: decided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Expense"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: not pending for current manager
  /v1/budget/summary:
    get:
      operationId: getBudgetSummary
      summary: 查询本部门预算摘要
      tags: [Budget]
      security: [{bearerAuth: []}]
      responses:
        "200":
          description: budget summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetSummary"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 业务用户 Access Token（由 /oauth/token 签发，经 ActWeave 透传注入）
  parameters:
    ExpenseId:
      name: id
      in: path
      required: true
      schema:
        type: string
  schemas:
    User:
      type: object
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        department: {type: string}
        role: {type: string, enum: [employee, manager]}
        managerUsername: {type: string}
    Expense:
      type: object
      properties:
        id: {type: string}
        title: {type: string}
        category: {type: string}
        amountCny: {type: number}
        currency: {type: string}
        reason: {type: string}
        status: {type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]}
        submitterUsername: {type: string}
        approverUsername: {type: string}
        decisionNote: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        submittedAt: {type: string, format: date-time}
        decidedAt: {type: string, format: date-time}
    CreateExpenseRequest:
      type: object
      required: [title, category, amountCny, reason]
      properties:
        title: {type: string}
        category: {type: string}
        amountCny: {type: number}
        reason: {type: string}
        autoSubmit: {type: boolean, description: true 则直接进入 SUBMITTED}
    DecideRequest:
      type: object
      required: [decision]
      properties:
        decision: {type: string, enum: [APPROVE, REJECT]}
        note: {type: string}
    BudgetSummary:
      type: object
      properties:
        department: {type: string}
        currency: {type: string}
        remainingBudgetCny: {type: number}
        pendingApprovalCny: {type: number}
        approvedThisPeriodCny: {type: number}
        asOf: {type: string, format: date-time}
  responses:
    Unauthorized:
      description: missing or invalid bearer token
    Forbidden:
      description: not allowed for current subject
    NotFound:
      description: resource not found
    BadRequest:
      description: invalid request
