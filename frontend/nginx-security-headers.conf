# Shared security headers (ZKL-64 MEDIUM-06 / D7-A).
# Include from every location that sets its own add_header so Nginx does not drop inherited headers.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Enforced CSP after Report-Only validation in item 20.
# style-src 'unsafe-inline' is required for Vue/Element dynamic styles; script-src must stay strict.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; worker-src 'self' blob:" always;
# HSTS is for HTTPS production edge only (no includeSubDomains). Harmless on local HTTP; browsers ignore over cleartext.
add_header Strict-Transport-Security "max-age=31536000" always;
