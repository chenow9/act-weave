server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Default security headers for locations that do not set their own add_header.
  include /etc/nginx/snippets/actweave-security-headers.conf;

  location = /api {
    include /etc/nginx/snippets/actweave-security-headers.conf;
    proxy_pass http://backend:8080/api;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # AAP, Console run events, and long LLM job POSTs (prompt enhance / smart-dag turns).
  # Keep this regex location before the generic /api/ proxy.
  location ~ ^/api/(agent-access/v1/.+/runs/[^/]+/events|v1/workspaces/[^/]+/agent-runs/[^/]+/events|v1/workspaces/[^/]+/agents:preview-prompt-enhancement|v1/workspaces/[^/]+/agents/__command/preview-prompt-enhancement|v1/workspaces/[^/]+/workflow-generate-sessions/[^/]+/turns)$ {
    include /etc/nginx/snippets/actweave-security-headers.conf;
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_connect_timeout 15s;
    proxy_send_timeout 75s;
    proxy_read_timeout 75s;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    gzip off;
    add_header X-Accel-Buffering "no" always;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    include /etc/nginx/snippets/actweave-security-headers.conf;
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_connect_timeout 15s;
    proxy_send_timeout 240s;
    proxy_read_timeout 240s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed Vite assets: long-lived immutable cache; missing assets must 404 (no SPA fallback).
  location ^~ /assets/ {
    include /etc/nginx/snippets/actweave-security-headers.conf;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # index.html: always revalidate so clients pick up new hashed asset references.
  location = /index.html {
    include /etc/nginx/snippets/actweave-security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  # SPA deep links: serve application shell with revalidation.
  location / {
    include /etc/nginx/snippets/actweave-security-headers.conf;
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
