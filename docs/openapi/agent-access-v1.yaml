openapi: 3.0.3
info:
  title: ActWeave Agent Access Protocol
  version: '2026-07-20'
  description: >-
    Workspace- and Agent-scoped API for service principals. Management user JWTs
    are not valid on this surface. Persisted Run events use the AAP v1 Event
    Envelope; SSE transport signals are not persisted events.
servers:
  - url: /api/agent-access/v1
security:
  - AAPAccessToken: []
paths:
  /oauth/token:
    post:
      operationId: issueAgentAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                    - urn:ietf:params:oauth:grant-type:token-exchange
                agent_id: {type: string, format: uuid}
                scope: {type: string}
                client_assertion_type: {type: string}
                client_assertion: {type: string, writeOnly: true}
                subject_token: {type: string, writeOnly: true}
                subject_token_type:
                  type: string
                  enum: [urn:ietf:params:oauth:token-type:jwt]
                requested_token_type:
                  type: string
                  enum: [urn:ietf:params:oauth:token-type:access_token]
      responses:
        '200':
          description: >-
            Short-lived Agent Access token; never includes a refresh token.
            Token Exchange responses also include issued_token_type.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthToken'}
        '400': {$ref: '#/components/responses/OAuthError'}
        '401': {$ref: '#/components/responses/OAuthError'}
  /workspaces/{workspaceId}/agents/{agentId}/profile:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
    get:
      operationId: getAgentProfile
      responses:
        '200':
          description: Public integration profile for the bound Agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentProfile'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotVisible'}
  /workspaces/{workspaceId}/agents/{agentId}/conversations:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      operationId: createConversation
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Created Conversation.
          headers:
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateConversationResponse'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/conversations/{conversationId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: getConversation
      parameters:
        - {name: If-None-Match, in: header, schema: {type: string}}
      responses:
        '200':
          description: Conversation and recent Run summaries.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '304': {description: Not modified.}
        '404': {$ref: '#/components/responses/NotVisible'}
  /workspaces/{workspaceId}/agents/{agentId}/runs:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      operationId: createRun
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '202':
          description: Run accepted; the accepted event is already durable.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunResponse'}
        '200':
          description: SSE stream when stream=true and Accept is text/event-stream.
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/runs/{runId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRun
      parameters:
        - {name: If-None-Match, in: header, schema: {type: string}}
      responses:
        '200':
          description: Authoritative Run and ordered final Item snapshots.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunResponse'}
        '304': {description: Not modified.}
        '404': {$ref: '#/components/responses/NotVisible'}
  /workspaces/{workspaceId}/agents/{agentId}/runs/{runId}/events:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: streamRunEvents
      parameters:
        - name: Last-Event-ID
          in: header
          description: Last fully processed Run sequence; the server starts at sequence+1.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Catch-up followed by live SSE until terminal Run state or disconnect.
          content:
            text/event-stream:
              schema:
                type: string
                description: Each data field is an EventEnvelope. Heartbeats have no event ID.
        '404': {$ref: '#/components/responses/NotVisible'}
        '422': {$ref: '#/components/responses/ReplayCursorInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/runs/{runId}:cancel:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: cancelRun
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, example: '"run:3"'}
      responses:
        '200':
          description: Cancellation fact committed; idempotent replay returns the same Run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/runs/{runId}/interactions/{interactionId}:decide:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/RunId'}
      - {$ref: '#/components/parameters/InteractionId'}
    post:
      operationId: decideInteraction
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: If-Match
          in: header
          required: true
          description: Strong Interaction version ETag.
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, decline, cancel]}
      responses:
        '200':
          description: Decision fact committed; continue consuming the Run event stream.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InteractionDecisionResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
components:
  securitySchemes:
    AAPAccessToken:
      type: http
      scheme: bearer
      bearerFormat: AAP JWT
      description: Short-lived token with Agent Access audience; user JWTs are rejected.
  parameters:
    WorkspaceId: {name: workspaceId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    AgentId: {name: agentId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    ConversationId: {name: conversationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    RunId: {name: runId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    InteractionId: {name: interactionId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
  headers:
    NoStore: {schema: {type: string, example: no-store}}
  schemas:
    UUID: {type: string, format: uuid}
    OAuthToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string, writeOnly: true}
        issued_token_type:
          type: string
          enum: [urn:ietf:params:oauth:token-type:access_token]
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, format: int64, minimum: 1, maximum: 900}
        scope: {type: string}
    AgentProfile:
      type: object
      additionalProperties: false
      required: [object, id, name, description, version, supportedContent, capabilities, interactionRequirements]
      properties:
        object: {type: string, enum: [agent_profile]}
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        description: {type: string}
        version: {type: string}
        supportedContent: {type: array, items: {type: object}}
        capabilities: {type: array, items: {type: object}}
        interactionRequirements: {type: object}
    Conversation:
      type: object
      additionalProperties: false
      required: [object, id, agentId, title, status, version, createdAt, updatedAt, runs]
      properties:
        object: {type: string, enum: [conversation]}
        id: {$ref: '#/components/schemas/UUID'}
        agentId: {$ref: '#/components/schemas/UUID'}
        title: {type: string}
        status: {type: string, enum: [active, archived]}
        version: {type: integer, format: int64, minimum: 1}
        latestRunId: {$ref: '#/components/schemas/UUID'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        runs: {type: array, items: {$ref: '#/components/schemas/RunSummary'}}
    CreateConversationResponse:
      type: object
      additionalProperties: false
      required: [conversation, idempotent]
      properties:
        conversation: {$ref: '#/components/schemas/Conversation'}
        idempotent: {type: boolean}
    RunSummary:
      type: object
      required: [object, id, status, version, startedAt]
      properties:
        object: {type: string, enum: [run]}
        id: {$ref: '#/components/schemas/UUID'}
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, format: int64}
        errorCode: {type: string}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [input, stream]
      properties:
        conversationId: {$ref: '#/components/schemas/UUID'}
        input:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, role, content]
            properties:
              type: {type: string, enum: [message]}
              role: {type: string, enum: [user]}
              content:
                type: array
                minItems: 1
                items:
                  type: object
                  additionalProperties: false
                  required: [type, text]
                  properties:
                    type: {type: string, enum: [text]}
                    text: {type: string, minLength: 1}
        stream: {type: boolean}
        metadata:
          type: object
          maxProperties: 32
          additionalProperties: {type: string, maxLength: 512}
        # Additive optional write-only envelope for REQUEST_PASSTHROUGH Connections.
        # value is writeOnly and MUST never appear in responses. Old callers without
        # passthrough requirements may omit this field.
        outboundCredentials:
          $ref: '#/components/schemas/OutboundCredentialsEnvelope'
    OutboundCredentialsEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, bindings]
      properties:
        schemaVersion: {type: string, enum: [outbound-credentials.v1]}
        bindings:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [connectionId, credentialType, value, expiresAt]
            properties:
              connectionId: {$ref: '#/components/schemas/UUID'}
              credentialType: {type: string, enum: [ACCESS_TOKEN]}
              value: {type: string, writeOnly: true, minLength: 1, maxLength: 16384}
              expiresAt: {type: string, format: date-time}
    RunStatus:
      type: string
      enum: [accepted, running, waiting_interaction, completed, failed, cancelled]
    Run:
      type: object
      additionalProperties: false
      required: [object, id, conversationId, agentId, status, version, startedAt, items, links]
      properties:
        object: {type: string, enum: [run]}
        id: {$ref: '#/components/schemas/UUID'}
        conversationId: {$ref: '#/components/schemas/UUID'}
        agentId: {$ref: '#/components/schemas/UUID'}
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, format: int64, minimum: 1}
        error: {$ref: '#/components/schemas/ErrorValue'}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        items:
          type: array
          description: Ordered final Item snapshots from the AAP Item union.
          items: {type: object}
        links:
          type: object
          additionalProperties: false
          required: [events]
          properties: {events: {type: string}}
    RunResponse:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        idempotent: {type: boolean}
    InteractionDecisionResponse:
      type: object
      additionalProperties: false
      required: [interaction, idempotent, links]
      properties:
        interaction: {type: object, description: AAP v1 Interaction snapshot.}
        idempotent: {type: boolean}
        links: {type: object}
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [specVersion, type, eventId, streamId, sequence, occurredAt, workspaceId, agentId, conversationId, runId, traceId, data]
      properties:
        specVersion: {type: string, enum: ['1.0']}
        type: {type: string}
        eventId: {$ref: '#/components/schemas/UUID'}
        streamId: {type: string, pattern: '^run:'}
        sequence: {type: integer, format: int64, minimum: 1}
        occurredAt: {type: string, format: date-time}
        workspaceId: {$ref: '#/components/schemas/UUID'}
        agentId: {$ref: '#/components/schemas/UUID'}
        conversationId: {$ref: '#/components/schemas/UUID'}
        runId: {$ref: '#/components/schemas/UUID'}
        traceId: {type: string}
        data: {type: object}
    ErrorValue:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        details: {type: object}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorValue'}
  responses:
    OAuthError:
      description: OAuth 2.0 error; credential details are never returned.
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error: {type: string}
              error_description: {type: string}
    Unauthenticated:
      description: Missing, expired, or invalid Agent Access token.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotVisible:
      description: Resource does not exist or is not visible in the bound Scope.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ValidationError:
      description: Request validation failed.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ReplayCursorInvalid:
      description: Last-Event-ID is malformed or beyond this Run's high watermark.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    IdempotencyConflict:
      description: The key was already used with a different normalized request hash.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: Resource version or terminal state conflicts with the command.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: One or more Workspace, Client, Agent, or Subject quota buckets is exhausted.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
        RateLimit-Limit: {schema: {type: integer}}
        RateLimit-Remaining: {schema: {type: integer}}
        RateLimit-Reset: {schema: {type: integer}}
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
