openapi: 3.0.3
info:
  title: ActWeave Agent Access Protocol
  version: '2026-08-11'
  description: >-
    Workspace- and Agent-scoped API for service principals. Management user JWTs
    are not valid on this surface. Persisted Run events use the AAP v1 Event
    Envelope; SSE transport signals are not persisted events.
servers:
  - url: /api/agent-access/v1
security:
  - AAPAccessToken: []
paths:
  /oauth/token:
    post:
      operationId: issueAgentAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type:
                  type: string
                  enum:
                    - client_credentials
                    - urn:ietf:params:oauth:grant-type:token-exchange
                agent_id: {type: string, format: uuid}
                scope: {type: string}
                client_assertion_type: {type: string}
                client_assertion: {type: string, writeOnly: true}
                subject_token: {type: string, writeOnly: true}
                subject_token_type:
                  type: string
                  enum: [urn:ietf:params:oauth:token-type:jwt]
                requested_token_type:
                  type: string
                  enum: [urn:ietf:params:oauth:token-type:access_token]
      responses:
        '200':
          description: >-
            Short-lived Agent Access token; never includes a refresh token.
            Token Exchange responses also include issued_token_type.
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OAuthToken'}
        '400': {$ref: '#/components/responses/OAuthError'}
        '401': {$ref: '#/components/responses/OAuthError'}
  /workspaces/{workspaceId}/agents/{agentId}/profile:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
    get:
      operationId: getAgentProfile
      responses:
        '200':
          description: Public integration profile for the bound Agent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentProfile'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '404': {$ref: '#/components/responses/NotVisible'}
  /workspaces/{workspaceId}/agents/{agentId}/conversations:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      operationId: createConversation
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title: {type: string, minLength: 1, maxLength: 200}
      responses:
        '201':
          description: Created Conversation.
          headers:
            Location: {schema: {type: string}}
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateConversationResponse'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/conversations/{conversationId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/ConversationId'}
    get:
      operationId: getConversation
      parameters:
        - {name: If-None-Match, in: header, schema: {type: string}}
      responses:
        '200':
          description: Conversation and recent Run summaries.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Conversation'}
        '304': {description: Not modified.}
        '404': {$ref: '#/components/responses/NotVisible'}
  /workspaces/{workspaceId}/agents/{agentId}/runs:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      operationId: createRun
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRunRequest'}
      responses:
        '202':
          description: Run accepted; the accepted event is already durable.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunResponse'}
        '200':
          description: SSE stream when stream=true and Accept is text/event-stream.
          content:
            text/event-stream:
              schema: {type: string}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/runs/{runId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: getRun
      parameters:
        - {name: If-None-Match, in: header, schema: {type: string}}
      responses:
        '200':
          description: Authoritative Run and ordered final Item snapshots.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunResponse'}
        '304': {description: Not modified.}
        '404': {$ref: '#/components/responses/NotVisible'}
  /workspaces/{workspaceId}/agents/{agentId}/runs/{runId}/events:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/RunId'}
    get:
      operationId: streamRunEvents
      parameters:
        - name: Last-Event-ID
          in: header
          description: Last fully processed Run sequence; the server starts at sequence+1.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        '200':
          description: Catch-up followed by live SSE until terminal Run state or disconnect.
          content:
            text/event-stream:
              schema:
                type: string
                description: Each data field is an EventEnvelope. Heartbeats have no event ID.
        '404': {$ref: '#/components/responses/NotVisible'}
        '422': {$ref: '#/components/responses/ReplayCursorInvalid'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/runs/{runId}:cancel:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/RunId'}
    post:
      operationId: cancelRun
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: If-Match
          in: header
          required: true
          schema: {type: string, example: '"run:3"'}
      responses:
        '200':
          description: Cancellation fact committed; idempotent replay returns the same Run.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RunResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/runs/{runId}/interactions/{interactionId}:decide:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/RunId'}
      - {$ref: '#/components/parameters/InteractionId'}
    post:
      operationId: decideInteraction
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - name: If-Match
          in: header
          required: true
          description: Strong Interaction version ETag.
          schema: {type: string, pattern: '^"[1-9][0-9]*"$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [decision]
              properties:
                decision: {type: string, enum: [approve, decline, cancel]}
      responses:
        '200':
          description: Decision fact committed; continue consuming the Run event stream.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/InteractionDecisionResponse'}
        '409': {$ref: '#/components/responses/Conflict'}
        '412': {$ref: '#/components/responses/Conflict'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/files:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
    post:
      operationId: createFile
      summary: Create an AAP file upload intent (presigned PUT).
      description: >-
        Allocates a fileId and returns a short-lived presigned PUT URL with
        Content-Length and Content-Type bound in the signature. The upload
        object appears only on this response — subsequent GET never echoes it.
        Requires file:write. Gated by agentAccess.files (default disabled).
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateFileRequest'}
      responses:
        '201':
          description: Upload intent created.
          headers:
            Location: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateFileResponse'}
        '200':
          description: Idempotent replay of the same create intent.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreateFileResponse'}
        '404': {$ref: '#/components/responses/NotVisible'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/files/{fileId}:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/FileId'}
    get:
      operationId: getFile
      summary: Get file status (source of truth; no SSE in v1).
      description: >-
        Returns file lifecycle status, processing stages, and a relative content
        link. Never includes upload URL, presign headers, or live download URLs.
        Requires file:read.
      responses:
        '200':
          description: File resource.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GetFileResponse'}
        '404': {$ref: '#/components/responses/NotVisible'}
  /workspaces/{workspaceId}/agents/{agentId}/files/{fileId}:complete:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/FileId'}
    post:
      operationId: completeFile
      summary: Confirm staging upload (fast path; does not wait for promote).
      description: >-
        Stats staging, validates size/MIME, CAS to UPLOADED, enqueues promote.
        Requires file:write and ownership. Does not block on encryption.
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
      responses:
        '200':
          description: Complete accepted; promote is asynchronous.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CompleteFileResponse'}
        '404': {$ref: '#/components/responses/NotVisible'}
        '409': {$ref: '#/components/responses/IdempotencyConflict'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/files/{fileId}/content:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/FileId'}
    get:
      operationId: getFileContent
      summary: Stream file content with Bearer (path A).
      description: >-
        Server-side SecureStore.Open stream. Requires file:read and READY file.
        Prefer :download for large bodies.
      responses:
        '200':
          description: Decrypted file body.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotVisible'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /workspaces/{workspaceId}/agents/{agentId}/files/{fileId}:download:
    parameters:
      - {$ref: '#/components/parameters/WorkspaceId'}
      - {$ref: '#/components/parameters/AgentId'}
      - {$ref: '#/components/parameters/FileId'}
    post:
      operationId: mintFileDownload
      summary: Mint an opaque download token (path B).
      description: >-
        Returns a short-lived opaque token id and relative proxy URL. Never
        returns MinIO credentials. Requires file:read and READY file.
      responses:
        '200':
          description: Download token minted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MintFileDownloadResponse'}
        '404': {$ref: '#/components/responses/NotVisible'}
        '422': {$ref: '#/components/responses/ValidationError'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /files/downloads/{tokenId}:
    parameters:
      - {$ref: '#/components/parameters/TokenId'}
    get:
      operationId: downloadFileByToken
      summary: Stream file content via opaque download token (no Bearer).
      security: []
      description: >-
        Validates the opaque token row (expiry, purpose, not consumed, file READY)
        and streams SecureStore body. Token is not a JWT and is not a MinIO key.
      responses:
        '200':
          description: Decrypted file body.
          content:
            application/octet-stream:
              schema: {type: string, format: binary}
        '404': {$ref: '#/components/responses/NotVisible'}
components:
  securitySchemes:
    AAPAccessToken:
      type: http
      scheme: bearer
      bearerFormat: AAP JWT
      description: Short-lived token with Agent Access audience; user JWTs are rejected.
  parameters:
    WorkspaceId: {name: workspaceId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    AgentId: {name: agentId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    ConversationId: {name: conversationId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    RunId: {name: runId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    InteractionId: {name: interactionId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    FileId: {name: fileId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    TokenId: {name: tokenId, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {$ref: '#/components/schemas/UUID'}
  headers:
    NoStore: {schema: {type: string, example: no-store}}
  schemas:
    UUID: {type: string, format: uuid}
    OAuthToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: {type: string, writeOnly: true}
        issued_token_type:
          type: string
          enum: [urn:ietf:params:oauth:token-type:access_token]
        token_type: {type: string, enum: [Bearer]}
        expires_in: {type: integer, format: int64, minimum: 1, maximum: 900}
        scope: {type: string}
    AgentProfile:
      type: object
      additionalProperties: false
      required: [object, id, name, description, version, supportedContent, capabilities, interactionRequirements]
      properties:
        object: {type: string, enum: [agent_profile]}
        id: {$ref: '#/components/schemas/UUID'}
        name: {type: string}
        description: {type: string}
        version: {type: string}
        supportedContent: {type: array, items: {type: object}}
        capabilities: {type: array, items: {type: object}}
        interactionRequirements: {type: object}
        # Optional; present only when agent context_policy.aap.enableA2UI is true (omit when disabled).
        a2ui:
          type: object
          additionalProperties: false
          required: [enabled, delivery, streaming, actions, maxSurfaceBytes, specHint, catalogIds]
          properties:
            enabled: {type: boolean}
            delivery: {type: string, enum: [item_completed]}
            streaming: {type: boolean}
            actions: {type: boolean}
            maxSurfaceBytes: {type: integer, format: int64, minimum: 1}
            specHint: {type: string}
            # Component catalogs a surface may declare. A client that cannot render
            # any of these should not rely on a2ui parts.
            catalogIds:
              type: array
              minItems: 1
              items: {type: string, format: uri}
    Conversation:
      type: object
      additionalProperties: false
      required: [object, id, agentId, title, status, version, createdAt, updatedAt, runs]
      properties:
        object: {type: string, enum: [conversation]}
        id: {$ref: '#/components/schemas/UUID'}
        agentId: {$ref: '#/components/schemas/UUID'}
        title: {type: string}
        status: {type: string, enum: [active, archived]}
        version: {type: integer, format: int64, minimum: 1}
        latestRunId: {$ref: '#/components/schemas/UUID'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        runs: {type: array, items: {$ref: '#/components/schemas/RunSummary'}}
    CreateConversationResponse:
      type: object
      additionalProperties: false
      required: [conversation, idempotent]
      properties:
        conversation: {$ref: '#/components/schemas/Conversation'}
        idempotent: {type: boolean}
    RunSummary:
      type: object
      required: [object, id, status, version, startedAt]
      properties:
        object: {type: string, enum: [run]}
        id: {$ref: '#/components/schemas/UUID'}
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, format: int64}
        errorCode: {type: string}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [input, stream]
      properties:
        conversationId: {$ref: '#/components/schemas/UUID'}
        input:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: object
            additionalProperties: false
            required: [type, role, content]
            properties:
              type: {type: string, enum: [message]}
              role: {type: string, enum: [user]}
              content:
                type: array
                minItems: 1
                items:
                  oneOf:
                    - type: object
                      additionalProperties: false
                      required: [type, text]
                      properties:
                        type: {type: string, enum: [text]}
                        text: {type: string, minLength: 1}
                    - type: object
                      additionalProperties: false
                      required: [type, fileId]
                      properties:
                        type: {type: string, enum: [input_file]}
                        fileId: {$ref: '#/components/schemas/UUID'}
                        mediaType: {type: string, minLength: 1, maxLength: 255}
        stream: {type: boolean}
        metadata:
          type: object
          maxProperties: 32
          additionalProperties: {type: string, maxLength: 512}
        # Additive optional write-only envelope for REQUEST_PASSTHROUGH Connections.
        # value is writeOnly and MUST never appear in responses. Old callers without
        # passthrough requirements may omit this field.
        outboundCredentials:
          $ref: '#/components/schemas/OutboundCredentialsEnvelope'
    OutboundCredentialsEnvelope:
      type: object
      additionalProperties: false
      required: [schemaVersion, bindings]
      properties:
        schemaVersion: {type: string, enum: [outbound-credentials.v1]}
        bindings:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            additionalProperties: false
            required: [connectionId, credentialType, value, expiresAt]
            properties:
              connectionId: {$ref: '#/components/schemas/UUID'}
              credentialType: {type: string, enum: [ACCESS_TOKEN]}
              value: {type: string, writeOnly: true, minLength: 1, maxLength: 16384}
              expiresAt: {type: string, format: date-time}
    RunStatus:
      type: string
      enum: [accepted, running, waiting_interaction, completed, failed, cancelled]
    Run:
      type: object
      additionalProperties: false
      required: [object, id, conversationId, agentId, status, version, startedAt, items, links]
      properties:
        object: {type: string, enum: [run]}
        id: {$ref: '#/components/schemas/UUID'}
        conversationId: {$ref: '#/components/schemas/UUID'}
        agentId: {$ref: '#/components/schemas/UUID'}
        status: {$ref: '#/components/schemas/RunStatus'}
        version: {type: integer, format: int64, minimum: 1}
        error: {$ref: '#/components/schemas/ErrorValue'}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        items:
          type: array
          description: Ordered final Item snapshots from the AAP Item union.
          items: {type: object}
        links:
          type: object
          additionalProperties: false
          required: [events]
          properties: {events: {type: string}}
    RunResponse:
      type: object
      additionalProperties: false
      required: [run]
      properties:
        run: {$ref: '#/components/schemas/Run'}
        idempotent: {type: boolean}
    InteractionDecisionResponse:
      type: object
      additionalProperties: false
      required: [interaction, idempotent, links]
      properties:
        interaction: {type: object, description: AAP v1 Interaction snapshot.}
        idempotent: {type: boolean}
        links: {type: object}
    CreateFileRequest:
      type: object
      additionalProperties: false
      required: [mediaType, sizeBytes]
      properties:
        filename: {type: string, maxLength: 512}
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/webp, image/gif, application/pdf]
        sizeBytes: {type: integer, format: int64, minimum: 1}
        sha256: {type: string, pattern: '^[a-fA-F0-9]{64}$'}
        purpose:
          type: string
          enum: [GENERAL, VISION, DOCUMENT, TOOL_INPUT]
    File:
      type: object
      additionalProperties: false
      required: [object, id, agentId, status, mediaType, sizeBytes, purpose, processing, artifacts, links, createdAt, updatedAt]
      description: >-
        Public File resource. Must never include upload, presign, or live
        downloadUrl fields (sensitive acceptance).
      properties:
        object: {type: string, enum: [file]}
        id: {$ref: '#/components/schemas/UUID'}
        agentId: {$ref: '#/components/schemas/UUID'}
        status:
          type: string
          enum: [pending_upload, uploaded, processing, ready, failed, expired]
        filename: {type: string}
        mediaType: {type: string}
        detectedMediaType: {type: string}
        sizeBytes: {type: integer, format: int64}
        sha256: {type: string}
        purpose: {type: string}
        error: {$ref: '#/components/schemas/ErrorValue'}
        processing:
          type: object
          additionalProperties: false
          required: [version, stages]
          properties:
            version: {type: integer, format: int64}
            stages:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [stage, status]
                properties:
                  stage: {type: string}
                  status: {type: string}
        artifacts: {type: array, items: {type: object}}
        links:
          type: object
          additionalProperties: false
          required: [content]
          properties:
            content: {type: string, description: Relative Bearer content path (not a live token URL).}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        readyAt: {type: string, format: date-time}
    FileUpload:
      type: object
      additionalProperties: false
      required: [method, url, headers, expiresAt]
      description: Write-only create response fragment; never appears on GET.
      properties:
        method: {type: string, enum: [PUT]}
        url: {type: string, format: uri}
        headers:
          type: object
          additionalProperties: {type: string}
          description: Must include Content-Type and Content-Length for signed PUT.
        expiresAt: {type: string, format: date-time}
    CreateFileResponse:
      type: object
      additionalProperties: false
      required: [file, idempotent]
      properties:
        file: {$ref: '#/components/schemas/File'}
        upload: {$ref: '#/components/schemas/FileUpload'}
        idempotent: {type: boolean}
    CompleteFileResponse:
      type: object
      additionalProperties: false
      required: [file, idempotent]
      properties:
        file: {$ref: '#/components/schemas/File'}
        idempotent: {type: boolean}
    GetFileResponse:
      type: object
      additionalProperties: false
      required: [file]
      properties:
        file: {$ref: '#/components/schemas/File'}
    MintFileDownloadResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt, url]
      properties:
        token: {$ref: '#/components/schemas/UUID'}
        expiresAt: {type: string, format: date-time}
        url:
          type: string
          description: Relative path /api/agent-access/v1/files/downloads/{tokenId}
    EventEnvelope:
      type: object
      additionalProperties: false
      required: [specVersion, type, eventId, streamId, sequence, occurredAt, workspaceId, agentId, conversationId, runId, traceId, data]
      properties:
        specVersion: {type: string, enum: ['1.0']}
        type: {type: string}
        eventId: {$ref: '#/components/schemas/UUID'}
        streamId: {type: string, pattern: '^run:'}
        sequence: {type: integer, format: int64, minimum: 1}
        occurredAt: {type: string, format: date-time}
        workspaceId: {$ref: '#/components/schemas/UUID'}
        agentId: {$ref: '#/components/schemas/UUID'}
        conversationId: {$ref: '#/components/schemas/UUID'}
        runId: {$ref: '#/components/schemas/UUID'}
        traceId: {type: string}
        data: {type: object}
    ErrorValue:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        details: {type: object}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {$ref: '#/components/schemas/ErrorValue'}
  responses:
    OAuthError:
      description: OAuth 2.0 error; credential details are never returned.
      content:
        application/json:
          schema:
            type: object
            required: [error, error_description]
            properties:
              error: {type: string}
              error_description: {type: string}
    Unauthenticated:
      description: Missing, expired, or invalid Agent Access token.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    NotVisible:
      description: Resource does not exist or is not visible in the bound Scope.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ValidationError:
      description: Request validation failed.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    ReplayCursorInvalid:
      description: Last-Event-ID is malformed or beyond this Run's high watermark.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    IdempotencyConflict:
      description: The key was already used with a different normalized request hash.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    Conflict:
      description: Resource version or terminal state conflicts with the command.
      content: {application/json: {schema: {$ref: '#/components/schemas/ErrorResponse'}}}
    RateLimited:
      description: One or more Workspace, Client, Agent, or Subject quota buckets is exhausted.
      headers:
        Retry-After: {schema: {type: integer, minimum: 1}}
