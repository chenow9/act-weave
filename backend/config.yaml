# Local-development configuration. Production deployments should use a protected
# copy and override secrets through the documented ACTWEAVE_* environment variables.
server:
  address: ":8082"

logging:
  level: info
  format: text

database:
  dsn: postgres://actweave:actweave-dev@127.0.0.1:15432/actweave?sslmode=disable

# Required. Cross-replica SSE wakeup, AAP rate limits, cancel and security
# broadcasts. Not a durable fact store. Env: ACTWEAVE_REDIS_ADDR.
redis:
  addr: 127.0.0.1:16379
  password: ""
  db: 0
  keyPrefix: actweave

authentication:
  jwtSecret: actweave-development-jwt-secret-change-me

# Local development explicitly permits model gateways bound to loopback.
# Production copies should remove these CIDRs unless a trusted private model
# gateway is intentionally deployed there.
models:
  egress:
    allowedCidrs:
      - 127.0.0.0/8
      - ::1/128
      # Shadowrocket/Clash/Surge fake-ip (198.18.0.0/15). Needed so local Go
      # egress can reach public model hosts when system DNS is hijacked. Dev only.
      - 198.18.0.0/15

agentAccess:
  tokenEndpoint: http://127.0.0.1:8082/api/agent-access/v1/oauth/token
  # Local/dev: open AAP fully. Production should default enabled=false and use
  # workspace/client allowlists during gray rollout (see operator runbook).
  feature:
    enabled: true
    allowAllWorkspaces: true
    workspaceIds: []
    allowAllClients: true
    clientIds: []
  # AAP File surface (IC-04). Default closed; enable only after IC-11 GC/ops gate.
  # Env: ACTWEAVE_AAP_FILES_ENABLED, ACTWEAVE_AAP_FILES_ALLOW_ALL_*, etc.
  files:
    enabled: false
    allowAllWorkspaces: false
    workspaceIds: []
    allowAllClients: false
    clientIds: []
    maxBytes: 26214400
    maxPendingPerWorkspace: 20
    maxReadyBytesPerWorkspace: 5368709120
    runtimeMultimodal: false
  signingKeys:
    # Local development only. Production must mount a protected, stable PKCS#8
    # Ed25519 key file and set generateIfMissing=false.
    algorithm: EdDSA
    activeKeyId: actweave-local-aap-ed25519-v1
    privateKeyFile: .local/aap-signing-private.pem
    generateIfMissing: true
    maxTokenTtlSeconds: 900
    prepublishedPublicKeys: []
    retiredPublicKeys: []

# Outbound Subject Assertion signing domain (T1=A). MUST use different key files
# and kids from agentAccess.signingKeys. Public JWKS:
# GET /api/outbound-identity/v1/.well-known/jwks.json
outboundIdentity:
  issuer: http://127.0.0.1:8082/outbound
  signingKeys:
    algorithm: EdDSA
    activeKeyId: actweave-local-outbound-ed25519-v1
    privateKeyFile: .local/outbound-signing-private.pem
    generateIfMissing: true
    maxAssertionTtlSeconds: 60
    prepublishedPublicKeys: []
    retiredPublicKeys: []

# Agent full-trace debug audit (PLATFORM_ADMIN /logs). Default false.
# Env override: ACTWEAVE_AGENT_AUDIT_DEBUG. Changes require process restart.
agentAudit:
  debug: true

# Tool/Workflow management escape hatches. Production should keep allowForcePublish=false
# unless operators explicitly need PLATFORM_ADMIN force-publish without live trial/test.
# Also gates workflow compilation force-publish (skip trial). Env: ACTWEAVE_TOOLS_ALLOW_FORCE_PUBLISH.
# Restart required.
tools:
  allowForcePublish: true

encryption:
  masterKey: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

storage:
  minio:
    endpoint: 127.0.0.1:9000
    accessKey: actweave
    secretKey: actweave-minio-dev
    useSSL: false
    region: ""

bootstrapAdmin:
  username: admin
  password: actweave-admin-dev-change-me
  displayName: ACTWEAVE Administrator
  locale: zh-CN
  timezone: Asia/Singapore

runtime:
  # Agent engine: omitted runtime.agent loads as enabled=true +
  # allowAllWorkspaces=true (ADK / chatruntimebridge). Always eino; emergency
  # agent path is eino-only; rollback = previous binary / drain traffic.
  agent:
    enabled: true
    allowAllWorkspaces: true
  workflow:
    # P0 default after Load: engine=eino (compose CoreGraphRunner). Omitted
    # runtime.workflow stages the same. eino_core is an alias of eino.
    # Emergency rollback: engine: wrapper (or ACTWEAVE_RUNTIME_WORKFLOW_ENGINE=wrapper).
    # Gray: engine=eino, allowAllWorkspaces=false, workspaceIds: [...].
    engine: eino
    allowAllWorkspaces: true
  eino:
    maxIterations: 8
    maxToolInvocations: 16
  # Outer budget for one model config verification attempt. Must stay at or above
  # the sum of the inner probe budgets (Responses stream 30s + client tool_search
  # 45s + function calling 30s) plus a 15s connectivity allowance (30+45+30+15)
  # or those probes can never reach their own deadlines. Omitted → 120s;
  # accepted range 1..600; env override
  # ACTWEAVE_RUNTIME_MODEL_VERIFICATION_TIMEOUT_SECONDS.
  modelVerification:
    timeoutSeconds: 120
  # ZKL-74 platform kill-switch only. Product knobs: Model API + Agent in Console.
  # enabled=false → new runs fall back to legacy full history.
  # Gray: allowAllWorkspaces=false and workspaceIds: [uuid, ...].
  # Optional: mode (disabled|shadow|enforced), rolloutVersion (default session-context-default).
  sessionContext:
    enabled: true
    allowAllWorkspaces: true
    # ZKL-81 independent LLM compact gate (T6-A). Default OFF — do not enable in prod
    # via this commit. shadow = plan only; enforced = full compact path (later ICs).
    compaction:
      enabled: false
      mode: disabled
      allowAllWorkspaces: false
      workspaceIds: []
      rolloutVersion: context-compaction-default
  # platform_bounded / carry_all only. Omitted key stays Enabled=false
  # (SessionContext semantics; not promoted by applyRuntimeDefaults).
  # Native client_bounded is unaffected. client_bounded is the only native
  # production mode; platform_bounded and carry_all are additional Agentic
  # modes. Readiness accepts v1 or v2 three-tier capabilities.
  toolDisclosure:
    enabled: true
    allowAllWorkspaces: true
