services:
  postgres:
    image: postgres:17-alpine
    container_name: actweave-postgres
    environment:
      POSTGRES_DB: actweave
      POSTGRES_USER: actweave
      POSTGRES_PASSWORD: actweave-dev
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U actweave -d actweave"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: actweave-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: actweave-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: zkys123456
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: actweave-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set local http://minio:9000 admin zkys123456 &&
        mc mb --ignore-existing local/actweave-executions &&
        mc mb --ignore-existing local/actweave-audit-packages &&
        mc mb --ignore-existing local/actweave-tool-tests &&
        mc mb --ignore-existing local/actweave-connection-verifications &&
        mc mb --ignore-existing local/actweave-aap-staging &&
        mc mb --ignore-existing local/actweave-aap-files
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: actweave-backend
    environment:
      ACTWEAVE_CONFIG_FILE: /app/config.yaml
      ACTWEAVE_API_ADDR: ":8080"
      ACTWEAVE_POSTGRES_DSN: postgres://actweave:actweave-dev@postgres:5432/actweave?sslmode=disable
      ACTWEAVE_REDIS_ADDR: redis:6379
      ACTWEAVE_MINIO_ENDPOINT: minio:9000
      ACTWEAVE_MINIO_ACCESS_KEY: admin
      ACTWEAVE_MINIO_SECRET_KEY: zkys123456
      ACTWEAVE_MINIO_REGION: us-east-1
      ACTWEAVE_MINIO_USE_SSL: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: actweave-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"

volumes:
  postgres-data:
  redis-data:
  minio-data:
